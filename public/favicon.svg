<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Neo-Pop Hard Shadow -->
  <rect x="12" y="12" width="76" height="76" rx="22" fill="#0F172A" />

  <!-- Main Yellow Pop Badge -->
  <rect x="8" y="8" width="76" height="76" rx="22" fill="#FFE600" stroke="#0F172A" stroke-width="6" stroke-linejoin="round" />

  <!-- Top-Right Accent Dot -->
  <circle cx="68" cy="24" r="5" fill="#FF5E5E" stroke="#0F172A" stroke-width="2.5" />
  
  <!-- Top-Left Mini Dot -->
  <circle cx="24" cy="24" r="3.5" fill="#00F0FF" stroke="#0F172A" stroke-width="2" />

  <!-- Stylized Bold Neo-Pop 'S' -->
